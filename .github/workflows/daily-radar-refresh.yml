name: Daily Radar Refresh

on:
  schedule:
    # The digest must be ready before RomBot fetches at 09:30 UTC (12:30 Israel
    # IDT) or 10:30 UTC (12:30 Israel IST). GitHub starts scheduled runs late
    # and may drop one under load: from 2026-11-11 to 11-26 the 00:23 schedule
    # began 6.4-9.8h late, and the 11-24 digest landed at 10:19 UTC. Three
    # chances, the first to start does the day and the `due` job turns the
    # later ones into a no-op. Every schedule stays inside one UTC day, since
    # the digest is dated by the day it runs. Odd minutes avoid the
    # top-of-hour rush.
    - cron: "23 0 * * *"
    - cron: "23 2 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A later schedule waits for a running one, then finds today's digest served.
# Only schedules share the group: a group keeps one pending run and a newer
# arrival cancels it, which must never cancel a manual run.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'daily-radar-schedule' || github.run_id }}
  cancel-in-progress: false

jobs:
  due:
    name: Is today's digest still due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Reads what RomBot reads. Any failure to read it counts as due, and a
      # manual run always runs.
      - name: Check the served digest's date
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          served=$(curl -sS -m 20 https://hyperadar.today/api/daily-digest | jq -r '.date // empty' || true)
          [[ "$served" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || served=""
          if [ "$EVENT" = schedule ] && [ "$served" = "$today" ]; then
            echo "Today's digest ($today) is already served; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Served digest: ${served:-none}; running for $today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  run-all-agents:
    name: Run ${{ matrix.agent }}
    needs: [due]
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent:
          [
            github-radar,
            youtube-trends,
            hidden-gems,
            reddit-pulse,
            community-radar,
          ]

    steps:
      - name: Check out HypeRadar
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Resolve agent directory
        id: agent
        shell: bash
        env:
          AGENT_INPUT: ${{ matrix.agent }}
        run: |
          case "$AGENT_INPUT" in
            github-radar) directory=github_radar ;;
            reddit-pulse) directory=reddit_pulse ;;
            youtube-trends) directory=youtube_trends ;;
            hidden-gems) directory=hidden_gems ;;
            weekly-digest) directory=weekly_digest ;;
            community-radar) directory=community_ask ;;
            *) echo "Unknown agent"; exit 2 ;;
          esac
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Validate common secrets
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          for name in \
              MONGODB_URI PORT_CLIENT_ID PORT_CLIENT_SECRET \
              GROVE_API_KEY GROVE_BASE_URL GROVE_MODEL VOYAGE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Validate Reddit source secret
        if: matrix.agent == 'reddit-pulse'
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        run: |
          if [ -z "$MONID_API_KEY" ]; then
            echo "::error::MONID_API_KEY is not configured"
            exit 1
          fi

      - name: Validate YouTube API key secret
        if: matrix.agent == 'youtube-trends'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY is not configured — the YouTube Data API v3 source requires it"
            exit 1
          fi

      - name: Validate community-ask secret
        if: matrix.agent == 'community-radar'
        env:
          ROMBOT_COMMUNITY_ASK_TOKEN: ${{ secrets.ROMBOT_COMMUNITY_ASK_TOKEN }}
        run: |
          if [ -z "$ROMBOT_COMMUNITY_ASK_TOKEN" ]; then
            echo "::error::ROMBOT_COMMUNITY_ASK_TOKEN is not configured"
            exit 1
          fi

      - name: Run agent
        working-directory: integrations/${{ steps.agent.outputs.directory }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: hyperadar
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.HYPERADAR_GITHUB_TOKEN || github.token }}
          ROMBOT_COMMUNITY_ASK_TOKEN: ${{ secrets.ROMBOT_COMMUNITY_ASK_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # YouTube Data API v3 key: scoped to youtube-trends via the
          # Validate YouTube API key secret step above; the source reads it
          # from os.environ, so other agents silently ignore it when unset.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run --frozen python main.py

  generate-digest:
    name: Generate Daily Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [due, run-all-agents]
    if: always() && needs.due.outputs.run == 'true'

    steps:
      - name: Check out HypeRadar
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Generate daily digest
        working-directory: integrations/github_radar
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: hyperadar
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          GITHUB_TOKEN: ${{ secrets.HYPERADAR_GITHUB_TOKEN || github.token }}
          PYTHONPATH: ${{ github.workspace }}/integrations
        run: |
          uv run --frozen python -c "
          import asyncio
          from _shared.daily_digest import generate_daily_digest
          result = asyncio.run(generate_daily_digest())
          print('digest generated:', result is not None)
          if result is None:
              raise SystemExit('no digest: no published posts in the last 24h')
          print('items:', len(result['items']) if result else 0)
          "

      # After the agents (this job needs them) and even when the digest fails,
      # so hidden-gems' snapshot rows never pile up past Atlas Free.
      - name: Prune old snapshot signals
        if: ${{ !cancelled() }}
        working-directory: integrations/github_radar
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: hyperadar
          PYTHONPATH: ${{ github.workspace }}/integrations
        run: uv run --frozen python -m _shared.signal_prune

  notify:
    name: Notify on failure
    needs: [due, run-all-agents, generate-digest]
    if: >-
      always() && (needs.due.result != 'success' ||
      (needs.due.outputs.run == 'true' &&
      (needs.run-all-agents.result != 'success' || needs.generate-digest.result != 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post failure alert
        env:
          # ntfy topic URL (https://ntfy.sh/<topic>); the phone app shows the
          # alert and opens the run on tap.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DUE_RESULT: ${{ needs.due.result }}
          AGENTS_RESULT: ${{ needs.run-all-agents.result }}
          DIGEST_RESULT: ${{ needs.generate-digest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::error::HypeRadar daily refresh failed (due check: $DUE_RESULT, agents: $AGENTS_RESULT, digest: $DIGEST_RESULT) and ALERT_WEBHOOK_URL is not configured, so no alert was sent."
            exit 1
          fi
          curl -sS -f --max-time 15 -X POST "$ALERT_WEBHOOK_URL" \
            -H "Title: HypeRadar daily refresh failed" \
            -H "Priority: high" \
            -H "Click: $RUN_URL" \
            -d "Due check: $DUE_RESULT, agents: $AGENTS_RESULT, digest: $DIGEST_RESULT. Tomorrow's digest may be stale. Tap to open the run."
