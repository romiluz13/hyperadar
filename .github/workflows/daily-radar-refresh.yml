name: Daily Radar Refresh

on:
  schedule:
    # 05:00 UTC every day — fresh trending content ready before RomBot fetches
    # at 09:30 UTC (12:30 Israel IDT). GitHub Actions cron can delay 1-3h,
    # so we fire 4h+ early to ensure the digest is ready before RomBot pulls it.
    # Even with a 3h GHA delay: 05:00 + 3h = 08:00 start + ~7min run = 08:07
    # digest, leaving ~1h23m before RomBot fetches at 09:30 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-all-agents:
    name: Run ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent:
          [
            github-radar,
            youtube-trends,
            hidden-gems,
            reddit-pulse,
            community-radar,
          ]

    steps:
      - name: Check out HypeRadar
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Resolve agent directory
        id: agent
        shell: bash
        env:
          AGENT_INPUT: ${{ matrix.agent }}
        run: |
          case "$AGENT_INPUT" in
            github-radar) directory=github_radar ;;
            reddit-pulse) directory=reddit_pulse ;;
            youtube-trends) directory=youtube_trends ;;
            hidden-gems) directory=hidden_gems ;;
            weekly-digest) directory=weekly_digest ;;
            community-radar) directory=community_ask ;;
            *) echo "Unknown agent"; exit 2 ;;
          esac
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Validate common secrets
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: |
          for name in \
              MONGODB_URI PORT_CLIENT_ID PORT_CLIENT_SECRET \
              GROVE_API_KEY GROVE_BASE_URL GROVE_MODEL VOYAGE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install Reddit source CLI
        if: matrix.agent == 'reddit-pulse'
        run: npm install --global @brightdata/cli@0.3.2

      - name: Validate Reddit source secret
        if: matrix.agent == 'reddit-pulse'
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          if [ -z "$BRIGHTDATA_API_KEY" ]; then
            echo "::error::BRIGHTDATA_API_KEY is not configured"
            exit 1
          fi

      - name: Validate YouTube API key secret
        if: matrix.agent == 'youtube-trends'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::YOUTUBE_API_KEY is not configured — the YouTube Data API v3 source requires it"
            exit 1
          fi

      - name: Validate community-ask secret
        if: matrix.agent == 'community-radar'
        env:
          ROMBOT_COMMUNITY_ASK_TOKEN: ${{ secrets.ROMBOT_COMMUNITY_ASK_TOKEN }}
        run: |
          if [ -z "$ROMBOT_COMMUNITY_ASK_TOKEN" ]; then
            echo "::error::ROMBOT_COMMUNITY_ASK_TOKEN is not configured"
            exit 1
          fi

      - name: Run agent
        working-directory: integrations/${{ steps.agent.outputs.directory }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: hyperadar
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.HYPERADAR_GITHUB_TOKEN || github.token }}
          ROMBOT_COMMUNITY_ASK_TOKEN: ${{ secrets.ROMBOT_COMMUNITY_ASK_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # YouTube Data API v3 key: scoped to youtube-trends via the
          # Validate YouTube API key secret step above; the source reads it
          # from os.environ, so other agents silently ignore it when unset.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run --frozen python main.py

  generate-digest:
    name: Generate Daily Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [run-all-agents]
    if: always()

    steps:
      - name: Check out HypeRadar
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Generate daily digest
        working-directory: integrations/github_radar
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: hyperadar
          GROVE_API_KEY: ${{ secrets.GROVE_API_KEY }}
          GROVE_BASE_URL: ${{ secrets.GROVE_BASE_URL }}
          GROVE_MODEL: ${{ secrets.GROVE_MODEL }}
          PYTHONPATH: ${{ github.workspace }}/integrations
        run: |
          uv run --frozen python -c "
          import asyncio
          from _shared.daily_digest import generate_daily_digest
          result = asyncio.run(generate_daily_digest())
          print('digest generated:', result is not None)
          print('items:', len(result['items']) if result else 0)
          "

  notify:
    name: Notify on failure
    needs: [run-all-agents, generate-digest]
    if: always() && (needs.run-all-agents.result != 'success' || needs.generate-digest.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post failure alert
        env:
          # Slack-compatible incoming webhook. Optional: without it the job
          # only prints a visible warning banner in the run log.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          AGENTS_RESULT: ${{ needs.run-all-agents.result }}
          DIGEST_RESULT: ${{ needs.generate-digest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::HypeRadar daily refresh failed (agents: $AGENTS_RESULT, digest: $DIGEST_RESULT) but ALERT_WEBHOOK_URL is not configured — add it to repository secrets to receive push notifications."
            exit 0
          fi
          payload=$(printf '{"text": "HypeRadar daily refresh FAILED — agents: %s, digest: %s. The feed may be stale: %s"}' "$AGENTS_RESULT" "$DIGEST_RESULT" "$RUN_URL")
          curl -sS -f -X POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
